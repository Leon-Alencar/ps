<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="painel" id="painel-ao">
        <div class="lado-direito">
            <a href="index.html">
                <img src="imagem/logo.png" alt="logo" class="logo-foto" id="foto-al">
            </a>
            <h1 class="titulo" id="titulo-ad">
                <a href="index.html">Day Game</a>
            </h1>
        </div>

        <div class="nav-bar" id="nav-js">
            <nav class="nav-toff" id="toff-nav">
                <a href="index.html">Inicial</a>
                <a href="javascript:void(0)" onclick="abrirCarrinho()" class="carrinho-cup" id="carrinho-bx">
                    🛒 <span id="contador-carrinho">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main-box">
        <h2 class="texto-card-aventura">Aventura</h2>
        
        <section class="caixa" id="caixa-na">
            <div class="box-caixa-b" id="text-box-caixa-1">
                <img src="img/jogo1.png" alt="card AB" class="nova-bar">
                <h3 class="nomenclatura">Carta Base</h3>
                <p class="text-evnit">Jogo com quatro jogadores</p>
                <span class="texto-sc">R$ 185,00</span>
                <button onclick="adicionarAoCarrinho('Carta Base', 185.00)" class="button-copy" id="funchon-button-1">Comprar</button>
            </div>
            
            <div class="box-caixa-b" id="text-box-caixa-2">
                <img src="img/jogo2.png" alt="card CD" class="nova-bar">
                <h3 class="nomenclatura">Expansão</h3>
                <p class="text-evnit">Adiciona mais dois jogadores</p>
                <span class="texto-sc">R$ 95,00</span>
                <button onclick="adicionarAoCarrinho('Expansão', 95.00)" class="button-copy" id="funchon-button-2">Comprar</button>
            </div>
        </section>
    </main>

    <div class="carrinho-lateral" id="gaveta-carrinho">
        <div class="cabecalho-gaveta">
            <h3>Seu Carrinho</h3>
            <button onclick="fecharCarrinho()" class="botao-fechar">X</button>
        </div>
        
        <div class="corpo-carrinho" id="lista-itens-carrinho">
            <p>Seu carrinho está vazio.</p>
        </div>

        <div class="rodape-gaveta">
            <p>Desconto: <span id="valor-desconto">R$ 0,00</span></p>
            <p><strong>Total: <span id="valor-total">R$ 0,00</span></strong></p>
            <button class="botao-finalizar">Finalizar Compra</button>
        </div>
    </div>

    <footer class="rodape" id="footer-box">
        <section id="barra-footer" class="img-footer">
            <div class="direito-footer">
                <a href="index.html">
                    <img src="imagem/logo.png" alt="logo" class="logo-foto" id="foto-footer-id">
                    <p class="texto-footer">Day Game</p>
                </a>
            </div>

            <div class="direito-footer">
                <a href="politica.html">P. de Privacidade</a>
                <a href="sobre.html">Sobre Nós</a>
                <a href="form.html">Trabalhe aqui</a>
            </div>

            <div class="esquerda-footer">
                <a href="link.Insta"><img src="inst.png" alt="Instagram"></a>
                <a href="link.WhatsApp"><img src="whats.png" alt="WhatsApp"></a>
            </div>
        </section>
    </footer>

    <script src="script.js"></script>
</body>
</html>
