<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Game - Sugestão de Melhoria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="painel" id="painel-ao">
        <div class="lado-direito">
            <a href="index.html">
                <img src="https://img.icons8.com/?size=100&id=KY71leRG66mL&format=png&color=000000" alt="logo" class="logo-foto" id="foto-al">
            </a>
            <h1 class="titulo" id="titulo-ad">
                <a href="index.html">Day Game</a>
            </h1>
        </div>

        <div class="nav-bar" id="nav-js">
            <nav class="nav-toff" id="toff-nav">
                <a href="index.html">Inicial</a>
                <a href="sobre.html">Sobre os Jogos</a>
                <a href="sugestao.html">Sugestão</a>
                <a href="javascript:void(0)" onclick="abrirCarrinho()" class="carrinho-cup" id="carrinho-bx">
                    🛒 <span id="contador-carrinho">0</span>
                </a>
            </nav>
        </div>
    </header>

    <main class="main-box">
        <h2 class="texto-card-aventura">Sugestão de Melhoria</h2>
        
        <div style="display: flex; justify-content: center; padding: 20px;">
            <form class="formulario-sugestao" onsubmit="enviarSugestao(event)">
                <label for="email-sugestao">E-mail:</label>
                <input type="email" id="email-sugestao" placeholder="seuemail@email.com" required>

                <label for="contato-sugestao">Contato (Telefone):</label>
                <input type="text" id="contato-sugestao" placeholder="(34) 99999-9999" required>

                <label for="idade-sugestao">Idade:</label>
                <input type="number" id="idade-sugestao" placeholder="Sua idade" required>

                <label for="mensagem-sugestao">Sugestão:</label>
                <textarea id="mensagem-sugestao" rows="4" placeholder="Escreva sua sugestão..." required style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;"></textarea>

                <button type="submit" class="button-copy" style="margin-top: 10px;">Enviar Sugestão</button>
            </form>
        </div>
    </main>

    <div class="carrinho-lateral" id="gaveta-carrinho">
        <div class="cabecalho-gaveta">
            <h3>Seu Carrinho</h3>
            <button onclick="fecharCarrinho()" class="botao-fechar">X</button>
        </div>
        
        <div class="corpo-carrinho" id="lista-itens-carrinho">
            <p>Seu carrinho está vazio.</p>
        </div>

        <div class="rodape-gaveta">
            <p>Desconto: <span id="valor-desconto">R$ 0,00</span></p>
            <p><strong>Total: <span id="valor-total">R$ 0,00</span></strong></p>
            <button class="botao-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>
        </div>
    </div>

    <footer class="rodape" id="footer-box">
        <section id="barra-footer" class="img-footer">
            <div class="direito-footer">
                <a href="index.html">
                    <img src="https://img.icons8.com/?size=100&id=KY71leRG66mL&format=png&color=000000" alt="logo" class="logo-foto" id="foto-footer-id">
                    <p class="texto-footer">Day Game</p>
                </a>
            </div>

            <div class="direito-footer">
                <a href="https://transparencia.senac.br/#/">P. de Privacidade</a>
                <a href="sobre.html">Sobre os Jogos</a>
                <a href="https://mg.senac.br/web/guest/rede-de-carreiras1">Trabalhe aqui</a>
            </div>

            <div class="esquerda-footer">
                <a href="https://www.instagram.com/senacminas/"><img src="https://img.icons8.com/?size=100&id=53889&format=png&color=000000" alt="Instagram"></a>
                <a href="https://wa.me/5534984465569?text=Ol%C3%A1%2C%20gostei%20do%20seu%20site%2C%20vamos%20conversar%3F"><img src="https://img.icons8.com/?size=100&id=43317&format=png&color=000000" alt="WhatsApp"></a>
            </div>
        </section>
    </footer>

    <script src="script.js"></script>
</body>
</html>
