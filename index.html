<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coma Aqui</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="cabecalho">
    <!--Lado esquerdo LOGO e NOME DA EMPRESA-->
    <div class="marca-conainer">
        <img src="https://img.magnific.com/vetores-gratis/vetor-de-design-de-gradiente-colorido-de-passaro_343694-2506.jpg?semt=ais_hybrid&w=740&q=80" alt="logo-passaro" id="logo-restaurante" class="imagem-logo">
        <h1 id="titulo-restaurante" class="titulo-marca">Coma Aqui</h1>
    </div>
    <!--2.Lado direito MENU DE NAVEGAÇÃO no canto superior-->
    <nav class="menu-navegcao" id="menu-principal">
        <a href="#inicio">Início</a>
        <a href="#ajuda">Ajuda</a>
        <!--Link para a página do carrinho / pop-up -->
        <a href="carrinho.html" id="btn-ab" class="link-carrinho">🛒 
            <span id="contador-carrinho" class="bad-carrinho">0</span>
        </a>
    </nav>
   </header>

   <!--Corpo do site-->
   <main class="conteudo-p" id="incial">
    <h1 class="cardapios" id="esc-comi">Cardápio</h1>
    
    <section class="box-card">
        <img src="https://www.receiteria.com.br/wp-content/uploads/bruschetta-facil-730x480.jpg" alt="torrada com tomate" class="card">
        <article>
            <span class="nome-produto">Torrada italiana com molho de tomate</span>
            <span class="preco-produto">R$ 150,00</span>
        </article>
        <button type="button" class="bob">Eu quero</button>
    </section>

    <section class="box-card">
        <img src="https://p2.trrsf.com/image/fget/cf/940/0/images.terra.com/2022/08/05/40767670-cestinha-antepasto.jpg" alt="Cestinha-antepasto" class="card">
        <article>
            <span class="nome-produto">Cestinha de antepasto com berinjela</span>
            <span class="preco-produto">R$ 135,00</span>
        </article>
        <button type="button" class="bob">Eu quero</button>
    </section>

    <section class="box-card">
        <img src="https://i.pinimg.com/originals/2f/b2/3b/2fb23b4511247fe4813b6d25240244c0.jpg" alt="mini-sanduiche-verde" class="card">
        <article>
            <span class="nome-produto">Mini sanduíche verde com queijo coalho</span>
            <span class="preco-produto">R$ 95,00</span>
        </article>
        <button type="button" class="bob">Eu quero</button>
    </section>
   </main>

   <!--Rodapé-->
   <footer>
    <img src="https://img.magnific.com/vetores-gratis/vetor-de-design-de-gradiente-colorido-de-passaro_343694-2506.jpg?semt=ais_hybrid&w=740&q=80" alt="logo-passaro" id="logo-restaurante" class="imagem-logo">
    <section class="footer" id="rodpe">
        <a href="#">Política de Privacidade</a>
        <a href="#">Sobre nós</a>
        <a href="#">Trabalhe aqui</a>
        <a href="#ajuda">Ajuda</a>
    </section>
   </footer>
   <script src="script.js"></script>
</body>
</html>
